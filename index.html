<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lohi Bird - Flawless Edition</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-overlay">
            <div id="start-screen" class="screen">
                <h1>LOHI BIRD</h1>
                <p class="instructions">Press SPACE or Click to Start</p>
                <p class="controls">Controls: SPACE / Click / Tap</p>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <h2>GAME OVER</h2>
                <p class="score-display">Score: <span id="final-score">0</span></p>
                <p class="high-score-display">Best: <span id="high-score-display">0</span></p>
                <p class="restart-text">Press SPACE or Click to Restart</p>
            </div>
            <div id="hud" class="hidden">
                <div id="score">0</div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>

</html>
